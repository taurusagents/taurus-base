name: Publish images

on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    # Rebuild daily to pick up patched Ubuntu/base-package layers.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    # Without a cap a wedged step holds a runner for GitHub's six-hour default
    # and the image simply is not republished that night. The two images have
    # very different healthy durations, so each carries its own.
    timeout-minutes: ${{ matrix.job_timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_key: base
            image: ghcr.io/taurusagents/taurus-base
            dockerfile: Dockerfile
            smoke_tag: taurus-base-smoke
            # Healthy runs finish in well under ten minutes.
            job_timeout_minutes: 30
          - image_key: subscription
            image: ghcr.io/taurusagents/taurus-base-subscription
            dockerfile: Dockerfile.subscription
            smoke_tag: taurus-base-subscription-smoke
            # Compiling Codex single-threaded takes an hour and three quarters
            # on its own, and runner speed varies, so this sits well clear of it.
            job_timeout_minutes: 210
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable=${{ github.event_name != 'schedule' }}
            type=ref,event=tag

      - name: Build image for smoke test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          pull: true
          tags: ${{ matrix.smoke_tag }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test image
        # The base smoke takes a couple of minutes when healthy. This is the
        # backstop for a command inside it that stops responding: the job cap
        # would eventually catch that too, but this reports it in minutes and
        # names the step.
        timeout-minutes: 15
        run: |
          case "${{ matrix.image_key }}" in
            base)
              # Builder-only seccomp relaxation so the smoke can exercise the
              # browser sandbox probe syscalls in CI; this does not claim the
              # published runtime matches the same seccomp profile.
              # Comments must stay above the command: a comment placed between
              # backslash-continued lines ends the command at that point.
              docker run --rm \
                --security-opt seccomp=unconfined \
                -v "$PWD/browser-image-smoke.mjs:/tmp/browser-image-smoke.mjs:ro" \
                "${{ matrix.smoke_tag }}" bash -lc "
                  python3 --version &&
                  node --version &&
                  npm --version &&
                  tsc --version &&
                  prettier --version &&
                  eslint --version &&
                  go version &&
                  rg --version &&
                  fd --version &&
                  playwright --version &&
                  node -e 'const { createRequire } = require(\"node:module\"); const viaNodePath = require(\"playwright\"); const viaGlobalDir = createRequire(\"/usr/lib/node_modules/\")(\"playwright\"); if (typeof viaNodePath.chromium.launch !== \"function\" || typeof viaGlobalDir.chromium.launch !== \"function\") { process.exit(1); } console.log(\"playwright resolves through NODE_PATH and through /usr/lib/node_modules\");' &&
                  dig -v &&
                  /usr/bin/time --version &&
                  ss --version &&
                  pdftotext -v &&
                  convert -version &&
                  node /tmp/browser-image-smoke.mjs
                "
              ;;
            subscription)
              docker run --rm "${{ matrix.smoke_tag }}" bash -lc "
                python3 --version &&
                node --version &&
                npm --version &&
                sqlite3 --version &&
                tmp_db=\$(mktemp /tmp/codex-rollout.XXXXXX.sqlite) &&
                sqlite3 \"\$tmp_db\" \"CREATE TABLE threads (id TEXT, rollout_path TEXT, updated_at TEXT); INSERT INTO threads (id, rollout_path, updated_at) VALUES ('thread-1', 'sessions/run/rollout.jsonl', '2026-01-01T00:00:00Z');\" &&
                sqlite3 -readonly \"\$tmp_db\" \"SELECT rollout_path FROM threads WHERE id = 'thread-1' ORDER BY updated_at DESC;\" | tee /tmp/sqlite-rollout &&
                grep -F 'sessions/run/rollout.jsonl' /tmp/sqlite-rollout &&
                rm -f \"\$tmp_db\" &&
                claude --version | tee /tmp/claude-version &&
                grep -F '2.1.207' /tmp/claude-version &&
                codex --version | tee /tmp/codex-version &&
                grep -F '0.153.4' /tmp/codex-version &&
                test -f /usr/local/lib/taurus-subscription/runtime-versions.json &&
                node -e 'const manifest = require(\"/usr/local/lib/taurus-subscription/runtime-versions.json\"); if (manifest.claudeCode !== \"2.1.207\" || manifest.codex !== \"0.153.4\" || manifest.mcpSdk !== \"1.29.0\") { console.error(JSON.stringify(manifest)); process.exit(1); } console.log(JSON.stringify(manifest)); console.log(require.resolve(\"@modelcontextprotocol/sdk/server/index.js\"));'
              "
              ;;
            *)
              echo "Unknown image key: ${{ matrix.image_key }}" >&2
              exit 1
              ;;
          esac

      # Logging in only here keeps registry push credentials off the runner
      # while the image build compiles third-party code. Nothing above this
      # point talks to a registry that needs them: both images build from a
      # public Docker Hub base, and the smoke runs a locally loaded image.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push smoked image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag "${{ matrix.smoke_tag }}" "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
