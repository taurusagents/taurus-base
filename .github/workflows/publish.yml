name: Publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    # Rebuild daily to pick up patched Ubuntu/base-package layers.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ghcr.io/taurusagents/taurus-base
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable=${{ github.event_name != 'schedule' }}
            type=ref,event=tag

      - name: Build image for smoke test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          load: true
          pull: true
          tags: taurus-base-smoke
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test image
        run: |
          docker run --rm taurus-base-smoke bash -lc "
            python3 --version &&
            node --version &&
            go version &&
            rg --version &&
            fd --version &&
            playwright --version &&
            node -e 'const { chromium } = require(\"playwright\"); (async () => { const browser = await chromium.launch({ headless: true }); await browser.close(); })().catch((error) => { console.error(error); process.exit(1); });'
          "

      - name: Tag and push smoked image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag taurus-base-smoke "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
