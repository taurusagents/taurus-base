name: Publish images

on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    # Rebuild daily to pick up patched Ubuntu/base-package layers.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_key: base
            image: ghcr.io/taurusagents/taurus-base
            dockerfile: Dockerfile
            smoke_tag: taurus-base-smoke
          - image_key: subscription
            image: ghcr.io/taurusagents/taurus-base-subscription
            dockerfile: Dockerfile.subscription
            smoke_tag: taurus-base-subscription-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable=${{ github.event_name != 'schedule' }}
            type=ref,event=tag

      - name: Build image for smoke test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          pull: true
          tags: ${{ matrix.smoke_tag }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test image
        run: |
          case "${{ matrix.image_key }}" in
            base)
              docker run --rm \
                -v "$PWD/browser-image-smoke.mjs:/tmp/browser-image-smoke.mjs:ro" \
                "${{ matrix.smoke_tag }}" bash -lc "
                  python3 --version &&
                  node --version &&
                  go version &&
                  rg --version &&
                  fd --version &&
                  playwright --version &&
                  dig -v &&
                  /usr/bin/time --version &&
                  ss --version &&
                  pdftotext -v &&
                  convert -version | head -n 1 &&
                  node /tmp/browser-image-smoke.mjs
                "
              ;;
            subscription)
              docker run --rm "${{ matrix.smoke_tag }}" bash -lc "
                python3 --version &&
                node --version &&
                sqlite3 --version &&
                tmp_db=\$(mktemp /tmp/codex-rollout.XXXXXX.sqlite) &&
                sqlite3 \"\$tmp_db\" \"CREATE TABLE threads (id TEXT, rollout_path TEXT, updated_at TEXT); INSERT INTO threads (id, rollout_path, updated_at) VALUES ('thread-1', 'sessions/run/rollout.jsonl', '2026-01-01T00:00:00Z');\" &&
                sqlite3 -readonly \"\$tmp_db\" \"SELECT rollout_path FROM threads WHERE id = 'thread-1' ORDER BY updated_at DESC;\" | tee /tmp/sqlite-rollout &&
                grep -F 'sessions/run/rollout.jsonl' /tmp/sqlite-rollout &&
                rm -f \"\$tmp_db\" &&
                claude --version | tee /tmp/claude-version &&
                grep -F '2.1.207' /tmp/claude-version &&
                codex --version | tee /tmp/codex-version &&
                grep -F '0.144.1' /tmp/codex-version &&
                test -f /usr/local/lib/taurus-subscription/runtime-versions.json &&
                node -e 'const manifest = require(\"/usr/local/lib/taurus-subscription/runtime-versions.json\"); if (manifest.claudeCode !== \"2.1.207\" || manifest.codex !== \"0.144.1\" || manifest.mcpSdk !== \"1.29.0\") { console.error(JSON.stringify(manifest)); process.exit(1); } console.log(JSON.stringify(manifest)); console.log(require.resolve(\"@modelcontextprotocol/sdk/server/index.js\"));'
              "
              ;;
            *)
              echo "Unknown image key: ${{ matrix.image_key }}" >&2
              exit 1
              ;;
          esac

      - name: Tag and push smoked image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag "${{ matrix.smoke_tag }}" "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
